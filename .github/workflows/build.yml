name: build-corot

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup /opt/az
          sudo apt-get clean
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev python3 cpio rsync zip unzip lz4 zstd xz-utils
          git --version; python3 --version

      - name: Clone MiCode OSS (corot-t-oss, 5.15.78)
        run: |
          git clone --depth 1 --branch corot-t-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git ksrc
          cd ksrc && git log --oneline -1 && du -sh .git .

      - name: Fetch clang (system llvm-14, AOSP r450784e == clang 14.0.7)
        run: |
          sudo apt-get install -y -qq clang-14 lld-14 llvm-14
          ls /usr/lib/llvm-14/bin | head -20
          /usr/lib/llvm-14/bin/clang --version
          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

      - name: Configure (device config baseline)
        run: |
          cd ksrc
          mkdir -p out
          cp "$GITHUB_WORKSPACE/configs/corot-5.15.180.config" out/.config
          # 设备 config 里的 UNUSED_KSYMS_WHITELIST 是小米编译机的绝对路径，改为仓库内符号表
          # ACK 的 gen_kheaders.sh 硬编码 $srctree/tools/build/{cpio,tar}（kernel/build 仓库提供），改为系统命令
          sed -i 's|^cpio=.*|cpio=cpio|; s|^tar=.*|tar=tar|' kernel/gen_kheaders.sh
          sed -n '9,13p' kernel/gen_kheaders.sh
          which cpio tar || sudo apt-get install -y -qq cpio tar
          # 小米 build.sh 会现场生成 abi_symbollist.raw；我们直接关闭符号裁剪（只影响导出符号裁剪，不影响模块加载）
          scripts/config --file out/.config --disable TRIM_UNUSED_KSYMS
          grep -E "TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST" out/.config
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 \
            BRANCH=android13-5.15 KMI_GENERATION=8 \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" \
            olddefconfig

      - name: Config diff vs device
        run: |
          cd ksrc
          diff <(grep -E "^(CONFIG_|# CONFIG_)" "$GITHUB_WORKSPACE/configs/corot-5.15.180.config" | sort) \
               <(grep -E "^(CONFIG_|# CONFIG_)" out/.config | sort) > /tmp/cfgdiff.txt || true
          echo "diff lines: $(wc -l < /tmp/cfgdiff.txt)"; head -60 /tmp/cfgdiff.txt
          echo "---- key items ----"
          grep -E "^CONFIG_(KPROBES|MODVERSIONS|CFI_CLANG|LTO_CLANG|MODULES|KALLSYMS_ALL|LOCALVERSION)=" out/.config

      - name: Show config facts
        run: |
          cd ksrc
          grep -E "^CONFIG_(KALLSYMS|KALLSYMS_ALL|KPROBES|MODULES|MODVERSIONS|TRIM_UNUSED_KSYMS|LOCALVERSION|CFI_CLANG|LTO_CLANG)=|^# CONFIG_(MODULES|KPROBES|MODVERSIONS)" out/.config | sort || true

      - name: Build Image
        run: |
          set -o pipefail
          cd ksrc
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 -j"$(nproc)" \
            BRANCH=android13-5.15 KMI_GENERATION=8 \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" \
            Image > /tmp/build.log 2>&1 || true
          echo "---- last 60 lines ----"; tail -60 /tmp/build.log
          echo "---- first errors ----"; grep -nE "error:|Error [0-9]|undefined reference|No such file" /tmp/build.log | head -30
          grep -q "Image is ready" /tmp/build.log && echo BUILD_OK || { echo "::error::build failed"; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: Report
        run: |
          cd ksrc
          ls -lh out/arch/arm64/boot/Image || true
          echo "== kernel.release =="; cat out/include/config/kernel.release 2>/dev/null || true
          echo "== Linux version string =="; strings out/arch/arm64/boot/Image 2>/dev/null | grep -m3 "Linux version" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Image-baseline
          path: ksrc/out/arch/arm64/boot/Image
          if-no-files-found: warn

name: build-corot

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup /opt/az
          sudo apt-get clean
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev python3 cpio rsync zip unzip lz4 zstd xz-utils
          git --version; python3 --version

      - name: Clone MiCode OSS (corot-t-oss, 5.15.78)
        run: |
          git clone --depth 1 --branch corot-t-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git ksrc
          cd ksrc && git log --oneline -1 && du -sh .git .

      - name: Fetch clang (system llvm-14, AOSP r450784e == clang 14.0.7)
        run: |
          sudo apt-get install -y -qq clang-14 lld-14 llvm-14
          ls /usr/lib/llvm-14/bin | head -20
          /usr/lib/llvm-14/bin/clang --version
          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cd ksrc
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 \
            BRANCH=android13-5.15 KMI_GENERATION=8 \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" \
            mgk_64_k515_defconfig

      - name: Show config facts
        run: |
          cd ksrc
          grep -E "CONFIG_(KALLSYMS|KALLSYMS_ALL|KPROBES|MODULES|MODVERSIONS|TRIM_UNUSED_KSYMS|LOCALVERSION|CFI_CLANG|LTO_CLANG)=" out/.config | sort || true

      - name: Build Image
        run: |
          set -o pipefail
          cd ksrc
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 -j"$(nproc)" \
            BRANCH=android13-5.15 KMI_GENERATION=8 \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" \
            Image 2>&1 | tail -250

      - name: Report
        run: |
          cd ksrc
          ls -lh out/arch/arm64/boot/Image || true
          echo "== kernel.release =="; cat out/include/config/kernel.release 2>/dev/null || true
          echo "== Linux version string =="; strings out/arch/arm64/boot/Image 2>/dev/null | grep -m3 "Linux version" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Image-baseline
          path: ksrc/out/arch/arm64/boot/Image
          if-no-files-found: warn
